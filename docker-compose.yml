services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sensecluster
      POSTGRES_USER: sensecluster
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensecluster -d sensecluster"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
